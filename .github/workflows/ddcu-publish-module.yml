name: Publish Module

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2025
    environment: psgallery
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify manifest is valid
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest -Path ./src/DefenderDeviceControlUnmanaged/DefenderDeviceControlUnmanaged.psd1
          Write-Host "Manifest: $($manifest.Name) v$($manifest.Version)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF -replace 'refs/tags/v',''
            if ($tagVersion -ne $manifest.Version.ToString()) {
              throw "Tag version '$tagVersion' does not match manifest ModuleVersion '$($manifest.Version)'."
            }
          }

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Re-run unit tests as publish guard
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './src/Tests/Unit'
          $config.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $config
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path ./src/DefenderDeviceControlUnmanaged -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create $env:REF_NAME --generate-notes
