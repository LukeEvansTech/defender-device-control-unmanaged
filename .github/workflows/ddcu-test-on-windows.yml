name: Test on Windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester-pwsh:
    name: Pester (PowerShell 7.x)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester 6.x
        shell: pwsh
        run: |
          # Force TLS 1.2 before any PSGallery call. Harmless on pwsh 7+
          # (already the default) but kept symmetric with the 5.1 job below.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name Pester -MinimumVersion 6.0.1 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Import module (smoke check)
        shell: pwsh
        run: |
          Import-Module ./src/DefenderDeviceControlUnmanaged/DefenderDeviceControlUnmanaged.psd1 -Force
          $cmds = Get-Command -Module DefenderDeviceControlUnmanaged
          if ($cmds.Count -ne 6) {
            throw "Expected 6 exported cmdlets, got $($cmds.Count): $($cmds.Name -join ', ')"
          }
          $cmds | Format-Table Name, CommandType -AutoSize

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          # Pin the import too: install-time capping alone still lets Invoke-Pester
          # auto-load a newer major if one is present on the runner.
          Import-Module -Name Pester -MinimumVersion 6.0.1 -MaximumVersion 6.99.99 -Force -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './src/Tests/Unit'
          # Required: Invoke-Pester -Configuration returns nothing unless PassThru is set,
          # which leaves $result null and silently disables the FailedCount gate below.
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-pwsh.xml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './src/DefenderDeviceControlUnmanaged'
          $config.CodeCoverage.OutputPath = 'coverage-pwsh.xml'
          $result = Invoke-Pester -Configuration $config
          # Defense in depth: if PassThru is ever dropped, $result is $null and the
          # FailedCount gate silently passes. Fail loud instead of failing open.
          if ($null -eq $result) { throw 'Pester returned no result object - Run.PassThru must be $true.' }
          Write-Host "Coverage: $($result.CodeCoverage.CoveragePercent)%" -ForegroundColor Cyan
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pester-pwsh
          path: |
            pester-pwsh.xml
            coverage-pwsh.xml
          retention-days: 7

  pester-windows-powershell:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Pester 6.x
        shell: powershell
        run: |
          # Windows PowerShell 5.1 negotiates TLS 1.0 by default; the
          # PowerShell Gallery rejects anything below TLS 1.2 and surfaces
          # the failure as a flaky "No match was found for the specified
          # search criteria and module name 'Pester'." Pin TLS 1.2 before
          # any web call.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module -Name Pester -MinimumVersion 6.0.1 -MaximumVersion 6.99.99 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Import module (smoke check)
        shell: powershell
        run: |
          Import-Module ./src/DefenderDeviceControlUnmanaged/DefenderDeviceControlUnmanaged.psd1 -Force
          $cmds = Get-Command -Module DefenderDeviceControlUnmanaged
          if ($cmds.Count -ne 6) {
            throw "Expected 6 exported cmdlets, got $($cmds.Count): $($cmds.Name -join ', ')"
          }
          $cmds | Format-Table Name, CommandType -AutoSize

      - name: Run Pester unit tests
        shell: powershell
        run: |
          # Pin the import too: install-time capping alone still lets Invoke-Pester
          # auto-load a newer major if one is present on the runner.
          Import-Module -Name Pester -MinimumVersion 6.0.1 -MaximumVersion 6.99.99 -Force -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './src/Tests/Unit'
          # Required: Invoke-Pester -Configuration returns nothing unless PassThru is set,
          # which leaves $result null and silently disables the FailedCount gate below.
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-powershell.xml'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './src/DefenderDeviceControlUnmanaged'
          $config.CodeCoverage.OutputPath = 'coverage-powershell.xml'
          $result = Invoke-Pester -Configuration $config
          # Defense in depth: if PassThru is ever dropped, $result is $null and the
          # FailedCount gate silently passes. Fail loud instead of failing open.
          if ($null -eq $result) { throw 'Pester returned no result object - Run.PassThru must be $true.' }
          Write-Host "Coverage: $($result.CodeCoverage.CoveragePercent)%" -ForegroundColor Cyan
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pester-powershell
          path: |
            pester-powershell.xml
            coverage-powershell.xml
          retention-days: 7
