name: Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@ae6a65fc3deaaf909a08202d98850480fc8775eb # v1
    with:
      checkov-frameworks: github_actions
      trivy-scanners: vuln,secret,misconfig
