name: Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@4ad6729e601bf0b89eb08d8bf6ebc0e9cf91b775 # v1
    with:
      checkov-frameworks: github_actions
      trivy-scanners: vuln,secret,misconfig
