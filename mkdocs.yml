site_name: DefenderDeviceControlUnmanaged
site_url: https://lukeevanstech.github.io/defender-device-control-unmanaged/
repo_url: https://github.com/LukeEvansTech/defender-device-control-unmanaged/
repo_name: LukeEvansTech/defender-device-control-unmanaged
site_description: Microsoft Defender Device Control for unmanaged Windows 11 devices - no Intune, no domain GPO, no MDM.
site_author: Luke Evans

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Why this exists: why.md
  - Quickstart:
      - Install: quickstart/install.md
      - Audit mode: quickstart/audit-mode.md
      - Enforce mode: quickstart/enforce-mode.md
      - Verify: quickstart/verify.md
  - Concepts:
      - Registry surface: concepts/registry-surface.md
      - MDE attach gate: concepts/mde-attach-gate.md
      - Audit vs Enforce: concepts/audit-vs-enforce.md
      - Policy XML format: concepts/policy-xml-format.md
      - Scope: concepts/scope.md
  - How-to:
      - Extend device categories: howto/extend-device-categories.md
      - Validate custom XML: howto/validate-custom-xml.md
      - Onboard to MDE: howto/onboard-to-mde.md
      - Run end-to-end test: howto/run-end-to-end-test.md
      - Roll back: howto/roll-back.md
  - Reference:
      - Cmdlets:
          - Set-DefenderDcPolicy: reference/cmdlets/Set-DefenderDcPolicy.md
          - Get-DefenderDcPolicy: reference/cmdlets/Get-DefenderDcPolicy.md
          - Test-DefenderDcPolicy: reference/cmdlets/Test-DefenderDcPolicy.md
          - Test-DefenderDcPolicyXml: reference/cmdlets/Test-DefenderDcPolicyXml.md
          - Invoke-DefenderDcOnboarding: reference/cmdlets/Invoke-DefenderDcOnboarding.md
          - Invoke-DefenderDcUsbTest: reference/cmdlets/Invoke-DefenderDcUsbTest.md
      - Example XML:
          - PolicyGroups: reference/example-xml/PolicyGroups.md
          - PolicyRules.Audit: reference/example-xml/PolicyRules.Audit.md
          - PolicyRules.Enforce: reference/example-xml/PolicyRules.Enforce.md
  - Troubleshooting:
      - Symptom ladder: troubleshooting/index.md
      - KB:
          - "001: MpCmdRun rejects XML": troubleshooting/kb/001-mpcmdrun-rejects-xml.md
          - "002: MDE attach gate": troubleshooting/kb/002-mde-attach-gate.md
          - "003: No local event log": troubleshooting/kb/003-no-local-event-log.md
          - "004: Engine state stickiness": troubleshooting/kb/004-engine-state-stickiness.md
          - "005: Build 28000 CIM quirks": troubleshooting/kb/005-build-28000-cim-quirks.md
  - FAQ: faq.md
